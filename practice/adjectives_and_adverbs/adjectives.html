  <style>
    :root { --pico-font-size: 100%; }

    /* Spoiler styling */
    .spoiler {
      background-color: var(--pico-color, #111);
      color: transparent;
      user-select: none;
      border-radius: 4px;
      padding: 0.1em 0.4em;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      display: inline-block;
    }
    .spoiler.revealed {
      background-color: var(--pico-muted-background, rgba(128, 128, 128, 0.15));
      color: inherit;
      user-select: text;
    }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .badge { font-size: 0.85rem; opacity: 0.8; }
    article { margin-bottom: 1.25rem; }
    table td { vertical-align: middle; }

  </style>
</head>

  <script>
    function revealAll() {
      document.querySelectorAll('.spoiler').forEach(el => el.classList.add('revealed'));
    }
    function hideAll() {
      document.querySelectorAll('.spoiler').forEach(el => el.classList.remove('revealed'));
    }
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('spoiler')) {
        e.target.classList.toggle('revealed');
      }
    });
  </script>
